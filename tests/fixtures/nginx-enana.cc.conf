# Test fixture shaped like /etc/nginx/sites-enabled/zz-enana.cc.conf on the enana account host (2.3.26): the server blocks
# around the api.enana.cc `location /v1/ {` block, which is copied byte for byte from the live file. TLS, most of the API
# allow-list and the real upstream are left out. tests/update-nginx-content.py serves it with a private nginx (it fills in
# @PORT@ and replaces the /var/www/... and /opt/enana-cc/site paths with temp directories); tests/deploy-content-public.sh
# uses it as the nginx configuration of a fake host.
limit_req_zone $binary_remote_addr zone=enana_apihost:1m rate=5r/s;

upstream enana_pb {
    server 127.0.0.1:9;                    # 生产: PocketBase (127.0.0.1:8090); 测试里不会连到这里
}

server {
    listen 127.0.0.1:@PORT@ default_server;
    server_name enana.cc;
    root /opt/enana-cc/site;
    # 注释里的 { 和 } 不是结构 (update-nginx-content.py 按 nginx 的规则读配置: 引号、注释、${变量} 里的花括号都不算)
    add_header X-Enana-Fixture "a { b } # c" always;
    location = / {
        try_files /index.html =404;
    }
    location / {
        return 404;
    }
}

server {
    listen 127.0.0.1:@PORT@;
    server_name www.enana.cc;
    return 301 https://enana.cc${request_uri};
}

server {
    listen 127.0.0.1:@PORT@;
    server_name install.enana.cc;
    location /dl/ {
        alias /var/www/enana-dl/;
        expires -1;
    }
    location / {
        return 404;
    }
}

server {
    listen 127.0.0.1:@PORT@;
    server_name api.enana.cc;
    default_type application/json;

    # 网关校验: 生产里 proxy_pass 到 PocketBase 的 GET /api/enana/v1/session/check (204 / 401); 夹具直接回 401 (匿名请求在生产里也是 401)
    location = /_enana_auth {
        internal;
        return 401;
    }
    location @enana_unauthorized {
        return 401 '{"code":"unauthorized"}';
    }
    location @enana_forbidden {
        return 403 '{"code":"forbidden"}';
    }

    # 签名内容: manifest.json manifest.sig content-<seq>.tar.gz ping.json
    location /v1/ {
        limit_except GET { deny all; }     # 只读 (GET 含 HEAD)
        limit_req zone=enana_apihost burst=10 nodelay;
        auth_request /_enana_auth;
        error_page 401 = @enana_unauthorized;   # 失败时回 JSON, 方便 curl 脚本判断
        error_page 403 = @enana_forbidden;
        root /var/www/enana-cloud;
        expires -1;                        # no-cache; Cloudflare 上还应加一条「绕过缓存」规则 (见 README)
    }

    location ~ ^/api/enana/v1/(?:auth/login|session/heartbeat|session/logout|session/check|devices|devices/kick|plan|account/password|nodes)$ {
        limit_req zone=enana_apihost burst=10 nodelay;
        expires -1;
        proxy_pass http://enana_pb;
    }
    # 同步快照: 只允许 GET / PUT / DELETE 这一个精确路径
    location = /api/enana/v1/sync/snapshot {
        limit_except GET PUT DELETE { deny all; }
        client_max_body_size 6m;
        limit_req zone=enana_apihost burst=10 nodelay;
        expires -1;
        proxy_pass http://enana_pb;
    }
    location / {
        return 404 '{"code":"not_found"}';
    }
}
