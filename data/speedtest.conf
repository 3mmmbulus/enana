# 测速目标与测速文件 (仪表盘「测速」页)。只在用户点击「开始测速」时才会访问; 不含任何账号信息。
# 这里是「内置目标」; 用户在仪表盘里的增 / 删 / 改保存在 ~/.enana/speedtest-custom.tsv, 不会改动这个文件, 升级也不会覆盖用户的改动。
#
# target|id|分组|中文名|英文名|URL|可接受的 HTTP 状态码(逗号分隔)|图标(Lucide 图标名, 可空)|默认勾选(1/0, 缺省 1)
#   分组: global=海外  cn=国内  carrier=三大运营商  dev=开发者与云服务  media=影音与社交
#   状态码: 响应码在这个集合里 = 正常; 其它响应码 (如 403/429/451) = 「受限」(疑似 IP 被限制); 没有响应 = 「失败」。
#   会被 Cloudflare 人机验证拦截的站点 (claude/chatgpt/perplexity) 把 403 也算正常 — 它们只用来测「通不通、多快」, 不用来判断 IP 是否被封。
#   API 域名 (api.openai.com 等) 的根路径本来就不会返回 200 (401/404 = 能连通), 所以状态码填的是它们正常时的响应; 返回 403 = 这个 IP 所在地区被限制。
# file|id|范围|名称|URL|Range(可空)
#   范围: cn=国内测速文件 (只用于本地直连)  global=海外测速文件 (本地直连和每个节点都测)。每个文件最多下载 8 秒。

