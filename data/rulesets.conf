# 规则库 — 基线: 三个必选的社区规则集 (SagerNet/sing-geosite 与 sing-geoip 的 .srs)。本地文件 = rules/<tag>.srs, 由安装器 / `enana update` / 仪表盘「规则库」下载。
# 完整的规则库 (几十个社区规则集, 持续维护) 登录后由 enana 云端下发 (见 docs/ARCHITECTURE.md); 来源模板见 rule-sources.conf (jsDelivr 镜像优先, 国内可直连)。
# 想增加自己的规则集: 在仪表盘「规则库」里「添加规则集链接」, 不用改这个文件。
# 格式: tag|仓库|分支|远程文件名|名称|说明|essential|默认启用   (essential=1 的不可停用)
geosite-cn|SagerNet/sing-geosite|rule-set|geosite-cn.srs|国内网站|中国大陆网站域名 → 直连|1|1
geosite-notcn|SagerNet/sing-geosite|rule-set|geosite-geolocation-!cn.srs|海外网站|非中国大陆网站域名 → 兜底策略(默认自动线路)|1|1
geoip-cn|SagerNet/sing-geoip|rule-set|geoip-cn.srs|国内 IP 段|中国大陆 IP → 直连(其余域名解析后按 IP 判断)|1|1
