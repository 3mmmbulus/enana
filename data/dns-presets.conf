# DNS 预设 (仪表盘「DNS」页的下拉选项)。url: system=系统默认 / udp://主机[:端口] / tls://主机[:端口] (DoT) / https://主机[:端口]/路径 (DoH)
# 预设一律使用 IP 地址 (DoH 的证书都包含 IP), 不依赖其它 DNS 引导解析; 自定义若用域名会自动用系统 DNS 引导。
# 格式: 范围|id|名称|说明|url
cn|system|系统默认|使用系统设置里的 DNS,不额外加密|system
cn|alidns|阿里 DNS (DoH)|223.5.5.5,国内最常用,稳定、延迟低|https://223.5.5.5/dns-query
cn|alidns-dot|阿里 DNS (DoT)|223.5.5.5,加密的 TLS 直连,和 DoH 速度相近|tls://223.5.5.5
cn|dnspod|腾讯 DNSPod (DoH)|1.12.12.12,腾讯公共 DNS|https://1.12.12.12/dns-query
cn|dnspod-dot|腾讯 DNSPod (DoT)|1.12.12.12,加密的 TLS 直连|tls://1.12.12.12
cn|114|114DNS (UDP)|传统 UDP,无加密,兼容性最好|udp://114.114.114.114
cn|baidu|百度 DNS (UDP)|180.76.76.76,传统 UDP,无加密|udp://180.76.76.76
cn|custom|自定义||
global|cloudflare|Cloudflare (DoH)|1.1.1.1,速度快,隐私友好|https://1.1.1.1/dns-query
global|cloudflare-security|Cloudflare 安全版 (DoH)|1.1.1.2,自带恶意软件域名拦截|https://1.1.1.2/dns-query
global|google|Google (DoH)|8.8.8.8|https://8.8.8.8/dns-query
global|quad9|Quad9 (DoH)|9.9.9.9,自带恶意域名拦截|https://9.9.9.9/dns-query
global|adguard|AdGuard (DoH)|94.140.14.14,自带广告与追踪域名拦截|https://94.140.14.14/dns-query
global|opendns|OpenDNS (DoH)|208.67.222.222,思科旗下,自带钓鱼网站拦截|https://208.67.222.222/dns-query
global|custom|自定义||
