# 已知应用的推荐初始设置 — 基线 (仪表盘「应用」页)。完整列表登录后由 enana 云端下发 (见 docs/ARCHITECTURE.md)。
# 推荐状态: follow=跟随规则(开)  pin=该应用全部流量走固定出口  auto=全部走自动线路  direct=直连(关)
# 规则: 首次识别时, 已知应用采用推荐设置; 之后新装的应用一律默认「关」(直连), 并显示推荐值供一键采纳。
# 格式: 应用名|推荐状态|分组   (应用名 = .app 文件夹名, 不含 .app, 不分大小写, 支持结尾 *)
Claude|pin|AI
ChatGPT|pin|AI
Codex|pin|AI
Gemini|pin|AI
