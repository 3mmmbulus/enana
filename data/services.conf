# 网站/服务目录 — 基线 (随程序自带的最小集合: 核心的 AI 服务 → 固定出口)。
# 完整的、持续维护的精选目录 (几十个网站 / 应用 / 分组) 登录后由 enana 云端下发, 验签后缓存在 ~/.enana/cloud/ 并自动替换这里的基线; 见 docs/ARCHITECTURE.md。
# 格式: id|名称|分组|默认策略|基线域名(逗号, 含所有子域名)|社区规则集(逗号)|IP段(逗号)|说明
# 默认策略: pin=固定出口  auto=自动线路  direct=直连 (用户随时可改, 改动会被记住)
claude|Claude|ai|pin|claude.ai,claude.com,anthropic.com,claudeusercontent.com|||Claude 网页与桌面应用
chatgpt|ChatGPT / OpenAI|ai|pin|openai.com,chatgpt.com,oaistatic.com,oaiusercontent.com,sora.com,openai.org,chat.com|||ChatGPT、Sora、OpenAI API
gemini|Gemini|ai|pin|gemini.google.com,bard.google.com,aistudio.google.com,ai.google.dev,google.dev,makersuite.google.com,notebooklm.google.com,notebooklm.google,labs.google,deepmind.google,deepmind.com,generativelanguage.googleapis.com,clients6.google.com,accounts.google.com|||Gemini、AI Studio、NotebookLM;含 Google 登录域名
