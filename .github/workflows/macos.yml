name: macOS console and uninstall acceptance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-state:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Exercise SystemConfiguration using private preferences files only
        run: sudo "$(command -v python3)" tests/mac-proxy-state.py
      - name: Change the system proxy without a terminal (direct, sudo, native dialog, cancel)
        run: bash tests/sysproxy.sh
      - name: Record connection health, state changes and heartbeat events; automatic verdict
        run: bash tests/health.sh
      - name: My devices (heartbeat reports the enana and OS version; no Sign out on this device; signed-out devices leave the list)
        run: |
          bash tests/devices.sh
          node tests/devices-ui.test.js
      - name: Traffic statistics distinguish "no traffic" from "no samples" and survive concurrent samplers
        run: bash tests/stats.sh
      - name: Reset to the official default rules (official content refresh, backup, undo, rollback)
        run: bash tests/reset.sh
      - name: sing-box fallback download source and signed compatibility manifest
        run: bash tests/core.sh
      - name: Diagnostics summary (allow-list privacy) and upload flow
        run: bash tests/diag.sh
      - name: Dashboard system-proxy flow, sortable table headers and exit-assignment dialogs
        run: |
          node tests/sysproxy-ui.test.js
          node tests/sorter.test.js
          node tests/exits-ui.test.js
          node tests/moved-actions-ui.test.js
      - name: Verify terminal waits for Enter and renders one action per line
        run: python3 tests/console-pty.py
      - name: Check protected TUN cleanup and rollback
        run: bash tests/tun-service.sh
      - name: Root script integrity (config paths, staged tampering, preflight without prompts, command environment)
        run: bash tests/enhanced-root-integrity.sh
      - name: TUN policy changes without a restart (rule-data helper validation, apply decision)
        run: bash tests/tunrules.sh
      - name: Server deployment that finished but failed verification (actual port, reasons, verify-only retry)
        run: |
          bash tests/vps-pending.sh
          bash tests/vps-probe.sh
          node tests/vps-ui.test.js
          node tests/vps-verify-ui.test.js
      - name: Unit tests (log parsing, app scan and times, subscription refresh stability, diagnostics)
        run: bash tests/units.sh
      - name: Foreign sing-box inventory, port ownership and install-time prompts (stubbed ps, lsof, launchctl)
        run: bash tests/detect.sh
      - name: Enhanced/TUN isolated regressions (fingerprint, stop/restart decisions)
        run: bash tests/enhanced.sh
      - name: Exit assignment (which apps/sites/services use which fixed exit; default exit; move/freeze; delete/role guards)
        run: bash tests/exits.sh
      - name: Stop owned detached jobs while preserving unrelated processes
        run: python3 tests/stop-jobs.py
