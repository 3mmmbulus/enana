name: Windows published installer acceptance
on:
  push:
    branches: [main]
    paths: [get.ps1, tests/windows-bootstrap.ps1, .github/workflows/windows-download.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-bootstrap:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Verify the official download in a Restricted shell
        run: ./tests/windows-bootstrap.ps1 -HomeDir '${{ runner.temp }}/enana-download-acceptance'
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-download-logs
          path: |
            ${{ runner.temp }}/enana-download-acceptance/api.log
            ${{ runner.temp }}/enana-download-acceptance/check.log
            ${{ runner.temp }}/enana-download-acceptance/sing-box.log
          if-no-files-found: ignore
          retention-days: 7
