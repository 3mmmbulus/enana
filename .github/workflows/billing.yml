name: Cloud billing foundation
on:
  push:
    branches: [main]
    paths: ['server/**', 'lib/billing.sh', 'lib/api.sh', 'lib/plan.sh', 'lib/official.*', 'lib/servers.sh', 'lib/config.sh', 'tests/mock-account.py', 'ui/billing.js', 'ui/plan.js', 'tests/billing-*', 'tests/official-*', 'tests/update-official.sh', 'tests/diag-pocketbase.test.js', 'tests/devices-pocketbase.test.js', 'tests/email-verification-ui.test.js', 'website/verify.*', .github/workflows/billing.yml, 'ui/i18n/**', 'ui/css/billing.css', 'ui/v-settings.js', 'ui/app.js', 'tools/mock-server.js', 'server/update-billing.sh', 'tests/update-billing.sh', 'website/**', 'tests/website-*', 'tools/deploy-website.sh', 'tests/update-nginx-content.py', 'tests/deploy-content-public.sh', 'tests/fixtures/nginx-*']
  pull_request:
    paths: ['server/**', 'lib/billing.sh', 'lib/api.sh', 'lib/plan.sh', 'lib/official.*', 'lib/servers.sh', 'lib/config.sh', 'tests/mock-account.py', 'ui/billing.js', 'ui/plan.js', 'tests/billing-*', 'tests/official-*', 'tests/update-official.sh', 'tests/diag-pocketbase.test.js', 'tests/devices-pocketbase.test.js', 'tests/email-verification-ui.test.js', 'website/verify.*', .github/workflows/billing.yml, 'ui/i18n/**', 'ui/css/billing.css', 'ui/v-settings.js', 'ui/app.js', 'tools/mock-server.js', 'server/update-billing.sh', 'tests/update-billing.sh', 'website/**', 'tests/website-*', 'tools/deploy-website.sh', 'tests/update-nginx-content.py', 'tests/deploy-content-public.sh', 'tests/fixtures/nginx-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pocketbase:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch pinned PocketBase test runtime
        run: |
          mkdir -p "$RUNNER_TEMP/enana-pb-test"
          cd "$RUNNER_TEMP/enana-pb-test"
          curl -fsSL --retry 3 https://github.com/pocketbase/pocketbase/releases/download/v0.40.4/pocketbase_0.40.4_linux_amd64.zip -o pocketbase.zip
          echo '9042ec818570e79c3628dadcd0a756c1496d9e1173918ec409d133c02f82e5fa  pocketbase.zip' | sha256sum -c -
          unzip -q pocketbase.zip pocketbase
          chmod +x pocketbase
      - name: Test real database transactions and local SMTP activation
        env:
          PB_BIN: ${{ runner.temp }}/enana-pb-test/pocketbase
        run: node --test tests/billing-domain.test.js tests/billing-pocketbase.test.js tests/official-domain.test.js tests/official-pocketbase.test.js tests/billing-plan-ui.test.js tests/diag-pocketbase.test.js tests/prefs-pocketbase.test.js tests/devices-pocketbase.test.js tests/email-verification-ui.test.js tests/billing-ui.test.js tests/billing-smtp-admin.test.js
      - name: Check authenticated local bridge and exact amounts
        run: |
          python3 tests/billing-bridge.py
          python3 tests/official-bridge.py
      - name: Check deployment syntax
        run: |
          bash -n server/deploy-billing.sh
          bash -n server/update-official.sh
          python3 -m py_compile server/update-nginx.py
          bash -n server/deploy-prefs.sh
          python3 -m py_compile server/update-nginx-prefs.py
          bash -n server/update-billing.sh
          bash -n tests/update-billing.sh
          bash -n tools/deploy-website.sh
          python3 -m py_compile tests/website-check.py
          bash -n server/deploy-content-public.sh
          python3 -m py_compile server/update-nginx-content.py
          bash -n tests/deploy-content-public.sh
          python3 -m py_compile tests/update-nginx-content.py
      - name: Check the official-hooks update script (fake host, rollback paths, no secrets printed)
        run: bash tests/update-official.sh
      - name: Check the billing update script (fake host, migration, database backup, rollback paths, no secrets printed)
        run: bash tests/update-billing.sh
      - name: Check the public-content nginx edit (text transform; a real nginx before and after the edit)
        env:
          ENANA_REQUIRE_NGINX: '1'
        run: |
          command -v nginx >/dev/null 2>&1 || [ -x /usr/sbin/nginx ] || { sudo apt-get update -q && sudo apt-get install -y -q nginx; }
          python3 tests/update-nginx-content.py
      - name: Check the public-content deployment script (fake host, anonymous checks, rollback paths)
        run: bash tests/deploy-content-public.sh
      - name: Check the public website (static wording, hooks, install commands, SEO, copy buttons)
        run: |
          python3 tests/website-check.py
          node tests/website-copy.test.js
