name: Windows client acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Check no-argument bootstrap language selection
        run: ./tests/windows-bootstrap-language.ps1
      - name: Check terminal entry behavior
        run: ./tests/windows-cli.ps1
      - name: Check console-free worker launcher and exit handling
        run: ./tests/windows-launcher.ps1
      - name: Check private directory ACL without audit privileges
        run: ./tests/windows-acl.ps1
      - name: Check directory ACL in PowerShell Core
        shell: pwsh
        run: ./tests/windows-acl.ps1
      - name: Remove protected orphaned snapshots without affecting other users
        run: ./tests/windows-snapshot-remove.ps1
      - name: Fetch the published Windows manifest and its signature
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'published'
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri 'https://install.enana.cc/dl/windows-manifest.json' -OutFile (Join-Path $d 'windows-manifest.json') -TimeoutSec 60
          Invoke-WebRequest -UseBasicParsing -Uri 'https://install.enana.cc/dl/windows-manifest.json.sig' -OutFile (Join-Path $d 'windows-manifest.json.sig') -TimeoutSec 60
      - name: Check get.ps1 release-signature logic (Windows PowerShell 5.1)
        shell: bash
        env:
          PS_BIN: powershell
          REAL_SIG_DIR: ${{ runner.temp }}/published
        run: bash tests/windows-signature.sh
      - name: Check get.ps1 release-signature logic (PowerShell 7)
        shell: bash
        env:
          PS_BIN: pwsh
          REAL_SIG_DIR: ${{ runner.temp }}/published
        run: bash tests/windows-signature.sh
      - name: Parse get.ps1 and the bootstrap acceptance test (Windows PowerShell 5.1)
        run: |
          foreach ($f in 'get.ps1','tests/windows-bootstrap.ps1') { $e = $null; [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f).Path, [ref]$null, [ref]$e); if ($e) { $e | ForEach-Object { $_.Message }; throw "$f has syntax errors" } }
      - name: Parse get.ps1 and the bootstrap acceptance test (PowerShell 7)
        shell: pwsh
        run: |
          foreach ($f in 'get.ps1','tests/windows-bootstrap.ps1') { $e = $null; [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f).Path, [ref]$null, [ref]$e); if ($e) { $e | ForEach-Object { $_.Message }; throw "$f has syntax errors" } }
      - name: Install and exercise the real Windows client
        run: ./tests/windows-native.ps1 -HomeDir '${{ runner.temp }}/enana-native-acceptance'
      - name: Retain failure diagnostics without account or server credentials
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-acceptance-logs
          path: |
            ${{ runner.temp }}/enana-native-acceptance/api.log
            ${{ runner.temp }}/enana-native-acceptance/worker.log
            ${{ runner.temp }}/enana-native-acceptance/launcher.log
            ${{ runner.temp }}/enana-native-acceptance/check.log
            ${{ runner.temp }}/enana-native-acceptance/sing-box.log
          if-no-files-found: ignore
          retention-days: 7
